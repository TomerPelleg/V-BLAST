[project]
name = "vblast"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.3",
    "highspy>=1.15.1",
    "matplotlib>=3.11.0",
    "numba>=0.67.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyscipopt>=6.2.1",
    "scipy>=1.17.1",
    "scipy-stubs~=1.17.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
